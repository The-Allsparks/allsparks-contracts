name: CI

# What each job prevents:
#   test          - broken compile/tests, architecture regressions, consumer fixture,
#                   japicmp vs api/baseline/allsparks-contracts.jar
#   docs-structure - missing required contributor/architecture docs, API baseline,
#                    and optional catalog files; catalog must not be applied here
#
# Architecture tests and japicmp run inside `./gradlew check`.
# Third-party actions are pinned to full commit SHAs.

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Grant Gradle permissions
        if: runner.os != 'Windows'
        run: chmod +x gradlew
      - name: Compile, test, javadoc, consumer fixture, API compatibility
        run: ./gradlew check --no-daemon
      - name: Artifact smoke
        run: ./gradlew jar sourcesJar javadocJar --no-daemon

  docs-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Required documentation present
        run: |
          set -e
          test -f README.md
          test -f LICENSE
          test -f AGENTS.md
          test -f CONTRIBUTING.md
          test -f CODE_OF_CONDUCT.md
          test -f SECURITY.md
          test -f CHANGELOG.md
          test -f docs/architecture/ADR-0001-contract-boundary.md
          test -f docs/architecture/ADR-0002-lifecycle-deferred.md
          test -f docs/audits/cross-project-contract-audit.md
          test -f docs/compatibility.md
          test -f docs/adoption.md
          test -f docs/third-party.md
          test -f docs/version-catalog.md
          test -f gradle/allsparks-stack.versions.toml
          test -f api/baseline/allsparks-contracts.jar
          test -f api/baseline/README.md
      - name: Optional catalog is not applied by this build
        run: |
          set -e
          grep -q 'org.allsparks' gradle/allsparks-stack.versions.toml
          grep -q '0.1.0-rc.1' gradle/allsparks-stack.versions.toml
          grep -q '0.1.0-SNAPSHOT' gradle/allsparks-stack.versions.toml
          if grep -q 'versionCatalogs' settings.gradle; then
            echo 'settings.gradle must not register the optional catalog' >&2
            exit 1
          fi
          if grep -E 'java-platform|allsparks-bom' build.gradle; then
            echo 'do not add a mandatory BOM or stack meta-package' >&2
            exit 1
          fi
          if grep -q '\[bundles\]' gradle/allsparks-stack.versions.toml; then
            echo 'do not add a catalog bundle that pulls multiple functional libraries' >&2
            exit 1
          fi
