name: CI

# What each job prevents:
#   test          — broken compile/tests, architecture regressions, consumer fixture
#   docs-structure — missing required contributor/architecture docs
#
# Architecture tests run inside `./gradlew check`.
# Third-party actions are pinned to full commit SHAs.

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Grant Gradle permissions
        if: runner.os != 'Windows'
        run: chmod +x gradlew
      - name: Compile, test, javadoc, consumer fixture
        run: ./gradlew check --no-daemon
      - name: Artifact smoke
        run: ./gradlew jar sourcesJar javadocJar --no-daemon

  docs-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Required documentation present
        run: |
          set -e
          test -f README.md
          test -f LICENSE
          test -f AGENTS.md
          test -f CONTRIBUTING.md
          test -f CODE_OF_CONDUCT.md
          test -f SECURITY.md
          test -f CHANGELOG.md
          test -f docs/architecture/ADR-0001-contract-boundary.md
          test -f docs/audits/cross-project-contract-audit.md
          test -f docs/compatibility.md
          test -f docs/adoption.md
