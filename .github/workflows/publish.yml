name: Publish

# Publishes org.allsparks:allsparks-contracts to GitHub Packages.
# Runs on v* tags and manual workflow_dispatch only (not every main push),
# so SNAPSHOT spam is avoided. Third-party actions are pinned to full
# commit SHAs (same pins as ci.yml). This is experimental, not 1.0.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional Maven version override. Defaults to 0.1.0-SNAPSHOT."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Grant Gradle permissions
        run: chmod +x gradlew
      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          extra=()
          if [ -n "${RELEASE_VERSION:-}" ]; then
            extra+=(-PreleaseVersion="${RELEASE_VERSION}")
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            extra+=(-PreleaseVersion="${GITHUB_REF_NAME#v}")
          fi
          ./gradlew publish --no-daemon "${extra[@]}"
